# cargo deny check: licenses and advisories for the Rust workspace (ADR-0001).
[licenses]
# Exactly what the locked tree needs (`cargo metadata` licence expressions, 2026-11-22).
allow = ["MIT", "Apache-2.0", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Unicode-3.0", "CDLA-Permissive-2.0"]
private = { ignore = true }

[advisories]
yanked = "deny"

[bans]
multiple-versions = "allow"
