[workspace]
members = ["crates/*", "apps/engine"]
exclude = ["fuzz"]
resolver = "3"

[workspace.package]
edition = "2024"
version = "0.1.0"
publish = false

[workspace.dependencies]
domain = { path = "crates/domain" }
exchange-core = { path = "crates/exchange-core" }
exchange-binance = { path = "crates/exchange-binance" }
exchange-okx = { path = "crates/exchange-okx" }

anyhow = "1.0"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
proptest = "1.12"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json"] }
rust_decimal = { version = "1.43", default-features = false, features = ["std"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.54", features = ["rt-multi-thread", "net", "time", "signal", "sync", "macros", "io-util"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
tokio-util = "0.7"
toml = "1.2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
zstd = "0.14"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
