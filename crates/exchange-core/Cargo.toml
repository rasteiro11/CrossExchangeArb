[package]
name = "exchange-core"
description = "Venue-independent market-data plumbing: depth events, the WebSocket session runner, REST helper and tape."
edition.workspace = true
version.workspace = true
publish.workspace = true

[dependencies]
domain.workspace = true
futures-util.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-tungstenite.workspace = true
tokio-util.workspace = true
tracing.workspace = true
zstd.workspace = true

[features]
# Fake WebSocket/HTTP servers; enabled only from dev-dependencies, never in production builds.
testkit = []

[dev-dependencies]
# Turns on `testkit` for this crate's own integration tests.
exchange-core = { path = ".", features = ["testkit"] }
proptest.workspace = true

[lints]
workspace = true
